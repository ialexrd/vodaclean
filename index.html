<title>Клининг-сервис Вода</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --page-bg: #e9f2f3;
    --shell-bg: #f7fbfb;
    --bg: #eef5f6;
    --surface: #ffffff;
    --surface-2: #eef7f7;
    --surface-3: #e2eff0;
    --border: #dcebec;
    --border-soft: #e8f3f3;
    --text: #0d1e26;
    --text-2: #5c7278;
    --text-3: #8ba0a5;
    --accent: #00838f;
    --accent-strong: #00636d;
    --accent-soft: #e0f5f6;
    --accent-contrast: #ffffff;
    --accent-2: #00c3cd;
    --hero-grad-a: #00e2e7;
    --hero-grad-b: #007f86;
    --nav-active-bg: #034091;
    --nav-active-fg: #ffffff;
    --status-good-bg: #e2f6e9;
    --status-good-fg: #148a4d;
    --status-pending-bg: #fdecd2;
    --status-pending-fg: #a15e12;
    --status-bad-bg: #fde3e2;
    --status-bad-fg: #c22a2f;
    --chart-income: #009aa2;
    --chart-expense: #c97a0f;
    --shadow-1: 0 1px 2px rgba(4,45,51,.07), 0 1px 1px rgba(4,45,51,.05);
    --shadow-2: 0 20px 44px rgba(4,45,51,.16), 0 3px 10px rgba(4,45,51,.08);
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    --radius-pill: 999px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page-bg: #07161a;
      --shell-bg: #0d2024;
      --bg: #0a1a1e;
      --surface: #132a2f;
      --surface-2: #183338;
      --surface-3: #1e3d43;
      --border: #24474d;
      --border-soft: #1c383d;
      --text: #e9f6f7;
      --text-2: #a1bdc1;
      --text-3: #6c8b8f;
      --accent: #0ea0a8;
      --accent-strong: #3fc2ca;
      --accent-soft: #12363b;
      --accent-contrast: #04181a;
      --accent-2: #22cbd3;
      --hero-grad-a: #17b9c2;
      --hero-grad-b: #0a5a60;
      --nav-active-bg: #0ea0a8;
      --nav-active-fg: #04181a;
      --status-good-bg: #123a26;
      --status-good-fg: #71dc9f;
      --status-pending-bg: #3c2c12;
      --status-pending-fg: #f0b761;
      --status-bad-bg: #3a1719;
      --status-bad-fg: #f3928d;
      --chart-income: #0ea0a8;
      --chart-expense: #c98500;
      --shadow-1: 0 1px 2px rgba(0,0,0,.35);
      --shadow-2: 0 22px 48px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page-bg: #07161a;
    --shell-bg: #0d2024;
    --bg: #0a1a1e;
    --surface: #132a2f;
    --surface-2: #183338;
    --surface-3: #1e3d43;
    --border: #24474d;
    --border-soft: #1c383d;
    --text: #e9f6f7;
    --text-2: #a1bdc1;
    --text-3: #6c8b8f;
    --accent: #0ea0a8;
    --accent-strong: #3fc2ca;
    --accent-soft: #12363b;
    --accent-contrast: #04181a;
    --accent-2: #22cbd3;
    --hero-grad-a: #17b9c2;
    --hero-grad-b: #0a5a60;
    --nav-active-bg: #0ea0a8;
    --nav-active-fg: #04181a;
    --status-good-bg: #123a26;
    --status-good-fg: #71dc9f;
    --status-pending-bg: #3c2c12;
    --status-pending-fg: #f0b761;
    --status-bad-bg: #3a1719;
    --status-bad-fg: #f3928d;
    --chart-income: #0ea0a8;
    --chart-expense: #c98500;
    --shadow-1: 0 1px 2px rgba(0,0,0,.35);
    --shadow-2: 0 22px 48px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  svg{width:16px; height:16px; flex:0 0 auto; display:inline-block; vertical-align:-3px;}
  body{
    background:var(--page-bg);
    color:var(--text);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3,h4{font-family:'Manrope', ui-sans-serif, system-ui, sans-serif; margin:0; text-wrap:balance;}
  .num, input[type="number"], .money, time, .date-cell-num{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums;}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}

  #app{min-height:100vh; padding:22px; display:flex; justify-content:center;}

  /* ---------- Shell (outer framed card, like a product mockup) ---------- */
  .shell{
    width:100%; max-width:1440px;
    background:var(--shell-bg);
    border-radius:32px;
    box-shadow:var(--shadow-2);
    padding:14px 22px 26px;
  }

  /* ---------- Navbar (top pill bar) ---------- */
  .navbar{
    display:flex; align-items:center; gap:18px;
    background:var(--surface); border-radius:var(--radius-pill);
    padding:9px 10px 9px 16px; box-shadow:var(--shadow-1);
    margin-bottom:22px;
  }
  .brand{display:flex; align-items:center; gap:9px; flex:0 0 auto;}
  .brand-mark{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .brand-mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand-name{font-family:'Manrope'; font-weight:800; font-size:16px; letter-spacing:-0.01em;}
  .nav-links{display:flex; align-items:center; gap:3px; flex:1; margin:0 6px;}
  .nav-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:var(--radius-pill);
    color:var(--text-2); background:transparent; border:none;
    font-weight:700; font-size:13.5px; text-align:left; white-space:nowrap;
  }
  .nav-item svg{width:15px; height:15px; flex:0 0 auto; opacity:.8;}
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--nav-active-bg); color:var(--nav-active-fg);}
  .nav-item.active svg{opacity:1;}
  .nav-item:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .navbar-side{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--text-2); display:flex; align-items:center; justify-content:center;
    position:relative; flex:0 0 auto;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .icon-btn .dot{position:absolute; top:7px; right:8px; width:6px; height:6px; border-radius:50%; background:var(--status-bad-fg); border:1.5px solid var(--surface);}

  /* ---------- Mobile bottom nav ---------- */
  .mobile-nav{display:none;}

  /* ---------- Main ---------- */
  .page{padding:2px 10px 16px;}
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .topbar h1{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .topbar .sub{color:var(--text-2); font-size:13px; margin-top:3px;}
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:var(--radius-pill); border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-weight:700; font-size:13px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);}
  .btn svg{
    width:16px; height:16px; padding:4px; margin:-4px 0; box-sizing:content-box;
    border-radius:50%; background:var(--surface-3);
  }
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);}
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-primary svg{background:rgba(255,255,255,.24);}
  .btn-accent-outline{border-color:var(--accent); color:var(--accent); background:var(--surface);}
  .btn-accent-outline svg{background:var(--accent-soft); color:var(--accent);}
  .btn-danger{color:var(--status-bad-fg); border-color:var(--status-bad-bg);}
  .btn-danger:hover{background:var(--status-bad-bg);}
  .btn-danger svg{background:var(--status-bad-bg);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn-sm svg, .btn-ghost svg{background:none; padding:0; margin:0;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .pill-static{
    display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:var(--radius-pill);
    background:var(--surface); border:1px solid var(--border); font-weight:700; font-size:13px; color:var(--text);
  }
  .custom-range{display:inline-flex; align-items:center; gap:6px;}
  .custom-range .btn{padding:9px 10px; font-weight:600;}
  .custom-range-dash{color:var(--text-3); font-weight:600;}

  .demo-banner{
    background:var(--status-pending-bg); color:var(--status-pending-fg);
    border-radius:var(--radius-m); padding:11px 16px; font-size:12.5px; font-weight:500;
    margin-bottom:20px; display:flex; align-items:center; gap:9px; border:1px solid color-mix(in srgb, var(--status-pending-fg) 25%, transparent);
  }
  .demo-banner svg{width:18px; height:18px;}
  .row-title svg, .row-sub svg, td svg, .hint svg{width:12px; height:12px; vertical-align:-1px; opacity:.7;}

  /* ---------- KPI ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi-tile{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-l);
    padding:18px 19px; box-shadow:var(--shadow-1);
  }
  .kpi-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .kpi-icon{
    width:34px; height:34px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent);
  }
  .kpi-icon svg{width:16px; height:16px;}
  .kpi-icon.dark{background:var(--nav-active-bg); color:var(--nav-active-fg);}
  .kpi-icon.blue{background:var(--accent); color:#fff;}
  .kpi-icon.on-accent{background:rgba(255,255,255,.24); color:#fff;}
  .kpi-label{font-size:12.5px; color:var(--text-2); font-weight:700;}
  .kpi-row{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-top:10px;}
  .kpi-value{font-family:'IBM Plex Mono'; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
  .kpi-value.pos{color:var(--status-good-fg);}
  .kpi-value.neg{color:var(--status-bad-fg);}
  .kpi-note{font-size:12px; color:var(--text-3); margin-top:8px;}
  .change-pill{
    display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:var(--radius-pill);
    font-size:11px; font-weight:700; white-space:nowrap;
  }
  .change-pill.up{background:var(--status-good-bg); color:var(--status-good-fg);}
  .change-pill.down{background:var(--status-bad-bg); color:var(--status-bad-fg);}
  .change-pill.flat{background:var(--surface-3); color:var(--text-2);}

  .kpi-tile.hero{
    background:linear-gradient(135deg, var(--hero-grad-a), var(--hero-grad-b));
    border:none; color:#fff;
  }
  .kpi-tile.hero .kpi-label{color:rgba(255,255,255,.8);}
  .kpi-tile.hero .kpi-value{color:#fff;}
  .kpi-tile.hero .kpi-note{color:rgba(255,255,255,.72);}
  .kpi-tile.hero .change-pill{background:rgba(255,255,255,.24); color:#fff;}

  .panel{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-l);
    padding:20px 22px; box-shadow:var(--shadow-1); margin-bottom:20px;
    min-width:0;
  }
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .panel-head h2{font-size:15.5px; font-weight:700;}
  .panel-head .sub{font-size:12px; color:var(--text-3); margin-top:2px;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}
  @media (max-width:980px){ .two-col{grid-template-columns:1fr;} }

  .two-col-even{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
  @media (max-width:980px){ .two-col-even{grid-template-columns:1fr;} }

  /* ---------- Lists / rows ---------- */
  .row-list{display:flex; flex-direction:column;}
  .row-list-scroll{max-height:520px; overflow-y:auto; padding-right:4px;}
  .row-item{
    display:flex; align-items:center; gap:12px; padding:11px 4px;
    border-top:1px solid var(--border-soft);
  }
  .row-item:first-child{border-top:none;}
  .row-avatar{
    width:34px; height:34px; border-radius:9px; flex:0 0 auto;
    background:var(--surface-3); color:var(--text-2);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
  }
  .row-main{min-width:0; flex:1;}
  .row-title{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-sub{font-size:12px; color:var(--text-3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-end{flex:0 0 auto; text-align:right;}
  .empty-note{color:var(--text-3); font-size:13px; padding:18px 4px; text-align:center;}

  /* ---------- Badges / chips ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px;
    font-size:11.5px; font-weight:700; white-space:nowrap;
  }
  .pill-good{background:var(--status-good-bg); color:var(--status-good-fg);}
  .pill-pending{background:var(--status-pending-bg); color:var(--status-pending-fg);}
  .pill-bad{background:var(--status-bad-bg); color:var(--status-bad-fg);}
  .pill-neutral{background:var(--surface-3); color:var(--text-2);}
  .cleaner-chip{
    display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 5px; border-radius:100px;
    background:var(--surface-2); font-size:11.5px; font-weight:600; color:var(--text-2); border:1px solid var(--border-soft);
  }
  .cleaner-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}

  /* ---------- Forms ---------- */
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:13px; min-width:0;}
  .field label{font-size:12px; font-weight:600; color:var(--text-2);}
  .field .hint{font-size:11px; color:var(--text-3); font-weight:400;}
  .field input[type="text"], .field input[type="number"], .field input[type="tel"],
  .field input[type="date"], .field input[type="time"], .field input[type="password"], .field select, .field textarea{
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:12px; padding:9px 12px; width:100%;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .checkline{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500;}
  .form-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft);}
  .form-error{color:var(--status-bad-fg); font-size:12px; margin-top:-4px; margin-bottom:10px;}
  .chip-select{display:flex; flex-wrap:wrap; gap:7px;}
  .chip-toggle{
    padding:6px 11px; border-radius:100px; border:1px solid var(--border); background:var(--surface);
    font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  }
  .chip-toggle.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; min-width:520px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3);
    font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{padding:10px 10px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}

  /* ---------- Search ---------- */
  .search-box{position:relative; max-width:320px; flex:1;}
  .search-box input{
    width:100%; padding:9px 14px 9px 35px; border-radius:var(--radius-pill); border:1px solid var(--border);
    background:var(--surface); color:var(--text);
  }
  .search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-3);}

  /* ---------- Client cards ---------- */
  .client-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(258px,1fr)); gap:12px;}
  .client-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
    padding:15px; box-shadow:var(--shadow-1); display:flex; flex-direction:column; gap:9px; text-align:left;
    width:100%;
  }
  .client-card:hover{border-color:var(--accent);}
  .client-card-top{display:flex; align-items:center; gap:10px;}
  .client-card .ltv{margin-top:auto; display:flex; justify-content:space-between; align-items:baseline; padding-top:9px; border-top:1px solid var(--border-soft);}
  .client-card .ltv b{font-family:'IBM Plex Mono'; font-size:15px;}

  /* ---------- Calendar ---------- */
  .cal-nav{display:flex; align-items:center; gap:10px;}
  .cal-nav .label{font-weight:700; font-size:14.5px; min-width:150px; text-align:center; text-transform:capitalize;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:11px; font-weight:700; color:var(--text-3); text-align:center; padding-bottom:4px; text-transform:uppercase;}
  .cal-cell{
    min-height:92px; min-width:0; border:1px solid var(--border-soft); border-radius:10px; padding:6px 6px 7px;
    display:flex; flex-direction:column; gap:3px; background:var(--surface); text-align:left; width:100%;
  }
  .cal-cell:hover{border-color:var(--accent);}
  .cal-cell.muted{opacity:.42;}
  .cal-cell.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .cal-daynum{font-size:12px; font-weight:700; color:var(--text-2);}
  .cal-cell.today .cal-daynum{color:var(--accent-strong);}
  .cal-chip{
    font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:6px; background:var(--accent-soft); color:var(--accent-strong);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left;
  }
  .cal-chip.done{background:var(--status-good-bg); color:var(--status-good-fg);}
  .cal-chip.cancel{background:var(--status-bad-bg); color:var(--status-bad-fg); text-decoration:line-through;}
  .cal-more{font-size:10.5px; color:var(--text-3); font-weight:600;}
  .cal-chip-list{display:flex; flex-direction:column; gap:3px;}
  .cal-dot-list{display:none; flex-wrap:wrap; align-items:center; gap:3px; margin-top:auto;}
  .cal-dot{width:6px; height:6px; border-radius:50%; flex:0 0 auto; background:var(--accent-strong);}
  .cal-dot.done{background:var(--status-good-fg);}
  .cal-dot.cancel{background:var(--status-bad-fg); opacity:.6;}
  .cal-dot-more{font-size:8.5px; font-weight:700; color:var(--text-3);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,18,15,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow-2);
    width:100%; max-width:520px; padding:22px 24px 24px; margin-bottom:5vh;
  }
  .modal.wide{max-width:680px;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; gap:10px;}
  .modal-head h3{font-size:16.5px; font-weight:800;}
  .modal-close{background:none; border:none; color:var(--text-3); padding:4px; border-radius:7px;}
  .modal-close:hover{background:var(--surface-2); color:var(--text);}

  /* ---------- Photos ---------- */
  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:8px;}
  .photo-thumb{position:relative; border-radius:9px; overflow:hidden; aspect-ratio:1; background:var(--surface-2); border:1px solid var(--border-soft);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb .del{
    position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:6px;
    background:rgba(10,18,15,.6); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
  }
  .photo-add{
    aspect-ratio:1; border-radius:9px; border:1.5px dashed var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; color:var(--text-3); flex-direction:column; gap:3px; font-size:10.5px; font-weight:600;
  }
  .photo-add:hover{border-color:var(--accent); color:var(--accent);}
  .lightbox{position:fixed; inset:0; background:rgba(6,12,10,.86); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:var(--shadow-2);}
  .lightbox .modal-close{position:absolute; top:18px; right:18px; background:rgba(255,255,255,.12); color:#fff;}

  /* ---------- Detail drawer bits ---------- */
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:16px;}
  .detail-item .k{font-size:11px; color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .detail-item .v{font-size:13.5px; margin-top:5px; font-weight:500;}
  .section-title{font-size:12.5px; font-weight:700; color:var(--text-2); margin:18px 0 9px; display:flex; align-items:center; justify-content:space-between;}

  /* ---------- Chart ---------- */
  .legend{display:flex; gap:16px; font-size:12px; color:var(--text-2); font-weight:600; margin-bottom:10px; flex-wrap:wrap;}
  .chart-scroll{overflow-x:auto;}
  .chart-svg{width:100%; height:auto; min-width:420px; display:block;}
  .legend-item{display:flex; align-items:center; gap:6px;}
  .legend-swatch{width:9px; height:9px; border-radius:2.5px;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px); opacity:0; pointer-events:none;
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow-2); z-index:300; transition:opacity .18s ease, transform .18s ease;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}

  @media (max-width:820px){
    /* Tighter outer gutters (app shell → page → panel) so more of the
       screen width goes to actual content, without changing any scale. */
    #app{padding:6px;}
    .shell{border-radius:16px; padding:8px 6px 16px;}
    .nav-links{display:none;}
    /* Brand can now shrink and ellipsize instead of forcing the navbar
       (logo + name + bell/gear/profile) wider than very narrow phones. */
    .brand{flex:1 1 auto; min-width:0;}
    .brand-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
    .navbar{padding:7px;}
    .page{padding:2px 2px 78px;}
    .mobile-nav{
      display:flex; position:fixed; left:12px; right:12px; bottom:12px; z-index:50;
      background:var(--surface); border-radius:var(--radius-pill); box-shadow:var(--shadow-2);
      padding:6px; justify-content:space-around;
    }
    .mobile-nav .nav-item{flex-direction:column; gap:2px; padding:7px 4px; font-size:9.5px; flex:1; text-align:center; justify-content:center;}
    .mobile-nav .nav-item svg{width:18px; height:18px;}
    .two-col{grid-template-columns:1fr;}
    .two-col-even{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}

    /* Panels/cards: less padding so content has more room to breathe. */
    .panel{padding:12px 10px;}
    .kpi-tile{padding:12px 12px;}
    .client-card{padding:12px;}


    /* Calendar: shrink cells/gaps so 7 columns fit narrow screens, and swap
       the per-order text chips (unreadable at this width) for small dots —
       tapping the day still opens the full list in a modal. */
    .cal-grid{gap:4px;}
    .cal-cell{min-height:50px; padding:4px 3px 5px; border-radius:8px; gap:2px;}
    .cal-daynum{font-size:10.5px;}
    .cal-chip-list{display:none;}
    .cal-dot-list{display:flex;}
    .cal-dow{font-size:9.5px; padding-bottom:2px;}
    .cal-nav .label{min-width:0; font-size:13px;}

    /* Forms: stack paired fields instead of squeezing two inputs side by side. */
    .field-row{grid-template-columns:1fr;}
    .modal{padding:18px 16px 20px;}
    .modal-overlay{padding:5vh 10px;}

    /* Row lists (finances) shouldn't reserve a huge fixed scroll height on phones. */
    .row-list-scroll{max-height:400px;}

    /* Custom period range: native date inputs have a wide intrinsic minimum
       width, so let the pair wrap onto their own lines on narrow phones
       instead of forcing the topbar wider than the screen. */
    .custom-range{flex-wrap:wrap; width:100%; gap:6px;}
    .custom-range input[type="date"]{flex:1 1 auto; min-width:0; width:100%;}
    .custom-range-dash{display:none;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>

const THEME_KEY = 'cs-voda-theme';
function getEffectiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if(attr==='dark' || attr==='light') return attr;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}
function toggleTheme(){
  applyTheme(getEffectiveTheme()==='dark' ? 'light' : 'dark');
  render();
}
(function restoreTheme(){
  try{
    const saved = localStorage.getItem(THEME_KEY);
    if(saved==='dark' || saved==='light') document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();

/* ---------------- utils ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ return toISO(new Date()); }
function toISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function formatMoney(n){ n = Number(n)||0; return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₽'; }
function formatDateLong(s){ if(!s) return '—'; const d=parseISO(s); return `${d.getDate()} ${RU_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function formatDateShort(s){ if(!s) return '—'; const d=parseISO(s); return `${d.getDate()} ${RU_MONTHS[d.getMonth()].slice(0,3)}`; }
function formatDateWithDow(s){ if(!s) return '—'; const d=parseISO(s); const dow = RU_DOW[(d.getDay()+6)%7]; return `${dow}, ${d.getDate()} ${RU_MONTHS[d.getMonth()]}`; }
function initials(name){ const p=(name||'?').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase() || '?'; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function addInterval(dateStr, type){
  const d = parseISO(dateStr);
  if(type==='weekly') d.setDate(d.getDate()+7);
  else if(type==='biweekly') d.setDate(d.getDate()+14);
  else if(type==='monthly') d.setMonth(d.getMonth()+1);
  else if(type==='every4weeks') d.setDate(d.getDate()+28);
  return toISO(d);
}
function recurrenceLabel(type){
  return {weekly:'Раз в неделю', biweekly:'Раз в 2 недели', monthly:'Раз в месяц', every4weeks:'Раз в 4 недели', none:'Без повтора'}[type] || '';
}
function statusLabel(s){ return {scheduled:'Запланирован', completed:'Выполнен', cancelled:'Отменён'}[s] || s; }
function statusPillClass(s){ return {scheduled:'pill-pending', completed:'pill-good', cancelled:'pill-bad'}[s] || 'pill-neutral'; }
function toast(msg){

let DB = null;

const local = { clients:[], cleaners:[], orders:[], expenses:[] };
const localSub = { clients:[], cleaners:[], orders:[], expenses:[] };
const localPhotos = {}; // clientId -> [{id,dataUrl,caption,addedAt}]

function notifyLocal(col){ (localSub[col]||[]).forEach(fn=>fn(local[col].slice())); }

function subscribeCollection(col, cb){
  if(DB){
    return DB.collection(col).onSnapshot(
      snap => cb(snap.docs.map(d=>({id:d.id, ...d.data()}))),
      err => console.error('onSnapshot', col, err)
    );
  }
  localSub[col].push(cb);
  cb(local[col].slice());
  return () => { localSub[col] = localSub[col].filter(f=>f!==cb); };
}
async function addDoc(col, data){
  if(DB){ const ref = await DB.collection(col).add(data); return ref.id; }
  const id = uid(col);
  local[col].push({id, ...data});
  notifyLocal(col);
  return id;
}
async function updateDocById(col, id, data){
  if(DB){ await DB.doc(col+'/'+id).update(data); return; }
  const item = local[col].find(x=>x.id===id);
  if(item) Object.assign(item, data);
  notifyLocal(col);
}
async function deleteDocById(col, id){
  if(DB){ await DB.doc(col+'/'+id).delete(); return; }
  local[col] = local[col].filter(x=>x.id!==id);
  notifyLocal(col);
}
async function addPhoto(clientId, photo){
  const col = `clients/${clientId}/photos`;
  if(DB){ const ref = await DB.collection(col).add(photo); return ref.id; }
  const id = uid('photo');
  localPhotos[clientId] = localPhotos[clientId]||[];
  localPhotos[clientId].unshift({id, ...photo});
  return id;
}
async function getPhotos(clientId){
  const col = `clients/${clientId}/photos`;
  if(DB){
    const snap = await DB.collection(col).get();
    return snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> (b.addedAt||'').localeCompare(a.addedAt||''));
  }
  return (localPhotos[clientId]||[]).slice();
}
async function deletePhoto(clientId, photoId){
  const col = `clients/${clientId}/photos`;
  if(DB){ await DB.doc(col+'/'+photoId).delete(); return; }
  localPhotos[clientId] = (localPhotos[clientId]||[]).filter(p=>p.id!==photoId);
}

/* period presets for the dashboard's / finances' period switcher */
function periodBounds(period, customFrom, customTo){
  const now = new Date();
  if(period==='prevMonth'){
    const m = now.getMonth()===0 ? 11 : now.getMonth()-1;
    const y = now.getMonth()===0 ? now.getFullYear()-1 : now.getFullYear();
    const [f,t] = monthBounds(y,m);
    const m2 = m===0?11:m-1, y2 = m===0?y-1:y;
    const [f2,t2] = monthBounds(y2,m2);
    return {from:f, to:t, prevFrom:f2, prevTo:t2, label:'за прошлый месяц', pillLabel:'Прошлый месяц'};
  }
  if(period==='year'){
    const f = `${now.getFullYear()}-01-01`, t = `${now.getFullYear()}-12-31`;
    const f2 = `${now.getFullYear()-1}-01-01`, t2 = `${now.getFullYear()-1}-12-31`;
    return {from:f, to:t, prevFrom:f2, prevTo:t2, label:'за этот год', pillLabel:'Этот год'};
  }
  if(period==='prevYear'){
    const y = now.getFullYear()-1;
    const f = `${y}-01-01`, t = `${y}-12-31`;
    const f2 = `${y-1}-01-01`, t2 = `${y-1}-12-31`;
    return {from:f, to:t, prevFrom:f2, prevTo:t2, label:'за прошлый год', pillLabel:'Прошлый год'};
  }
  if(period==='custom'){
    const rawF = customFrom || todayISO(), rawT = customTo || todayISO();
    const f = rawF <= rawT ? rawF : rawT, t = rawF <= rawT ? rawT : rawF;
    const days = Math.round((parseISO(t) - parseISO(f)) / 86400000) + 1;
    const prevTo = toISO(new Date(parseISO(f).getTime() - 86400000));
    const prevFrom = toISO(new Date(parseISO(f).getTime() - days*86400000));
    return {from:f, to:t, prevFrom, prevTo, label:'за выбранный период', pillLabel:'Свой период'};
  }
  const [f,t] = monthBounds(now.getFullYear(), now.getMonth());
  const pm = now.getMonth()===0 ? 11 : now.getMonth()-1;
  const py = now.getMonth()===0 ? now.getFullYear()-1 : now.getFullYear();
  const [f2,t2] = monthBounds(py,pm);
  return {from:f, to:t, prevFrom:f2, prevTo:t2, label:'за этот месяц', pillLabel:'Этот месяц'};
}
function monthsInRange(from, to, cap){
  const f = parseISO(from), t = parseISO(to);
  const months = [];
  let y = f.getFullYear(), m = f.getMonth();
  const endY = t.getFullYear(), endM = t.getMonth();
  while((y < endY || (y===endY && m<=endM)) && months.length < (cap||36)){
    months.push({year:y, month:m});
    m++; if(m>11){ m=0; y++; }
  }
  return months;
}

function periodPickerHtml(period, customFrom, customTo, keyPeriod, keyFrom, keyTo){

}
function pctChange(cur, prev){
  if(prev===0) return cur===0 ? 0 : null;
  return ((cur-prev)/prev)*100;
}
function changePillHtml(pct){
  if(pct===null) return `<span class="change-pill flat">н/д</span>`;
  const dir = pct>0.05?'up':(pct<-0.05?'down':'flat');
  const arrow = dir==='up'?'↑':(dir==='down'?'↓':'·');
  return `<span class="change-pill ${dir}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
}
function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function hexInterp(hexA, hexB, t){
  const a = [1,3,5].map(i=>parseInt(hexA.slice(i,i+2),16));
  const b = [1,3,5].map(i=>parseInt(hexB.slice(i,i+2),16));
  const c = a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return '#'+c.map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
}

  function addOrder({clientId, date, time, amount, cleaners, status, service='', notes='', seriesId=null, recurrenceType='none'}){
    orders.push({
      id: uid('o'), clientId, clientName: clName(clientId), date, time, amount,
      cleanerIds: cleaners, cleanerNames: cleaners.map(cName),
      status, service, notes, seriesId, recurrenceType, createdAt: date,
    });
  }

  // Recurring series — generated from 8 months ago through a few weeks ahead;
  // anything before today is completed, anything from today on is scheduled.
  const series = [
    {clientId:c2, amount:5400, cleaners:[k2,k3], type:'weekly',   time:'19:30', anchorDay:3,  seriesId:'s_briz'},
    {clientId:c9, amount:6100, cleaners:[k5],    type:'weekly',   time:'08:00', anchorDay:2,  seriesId:'s_kovork'},
    {clientId:c5, amount:4800, cleaners:[k1],    type:'weekly',   time:'09:00', anchorDay:4,  seriesId:'s_salon'},
    {clientId:c7, amount:7200, cleaners:[k2,k4], type:'biweekly', time:'18:00', anchorDay:6,  seriesId:'s_stroy'},
    {clientId:c1, amount:3200, cleaners:[k1],    type:'biweekly', time:'11:00', anchorDay:5,  seriesId:'s_sokolova'},
    {clientId:c8, amount:3400, cleaners:[k4],    type:'biweekly', time:'13:00', anchorDay:9,  seriesId:'s_gricenko'},
    {clientId:c4, amount:2100, cleaners:[k3],    type:'monthly',  time:'09:00', anchorDay:1,  seriesId:'s_panova'},
  ];
  const scheduleCutoff = dm(1, 20);
  series.forEach(s=>{
    let date = dm(-5, s.anchorDay);
    let guard = 0;
    while(date <= scheduleCutoff && guard < 60){
      guard++;
      addOrder({clientId:s.clientId, date, time:s.time, amount:s.amount, cleaners:s.cleaners,
        status: date < today ? 'completed' : 'scheduled', seriesId:s.seriesId, recurrenceType:s.type});
      date = addInterval(date, s.type);
    }
  });

  // One-off completed jobs for non-recurring apartment clients, spread across months.
  [
    {clientId:c3, mo:-7, day:22, amount:2600, cleaners:[k1], notes:'Уборка после ремонта'},
    {clientId:c3, mo:-4, day:14, amount:2800, cleaners:[k2], notes:''},
    {clientId:c3, mo:-1, day:19, amount:2700, cleaners:[k1], notes:''},
    {clientId:c6, mo:-5, day:16, amount:2900, cleaners:[k3], notes:''},
    {clientId:c6, mo:-3, day:21, amount:3000, cleaners:[k5], notes:''},
    {clientId:c6, mo:-1, day:6,  amount:2900, cleaners:[k3], notes:''},
    {clientId:c10,mo:-1, day:29, amount:4200, cleaners:[k2,k4], notes:'Генеральная уборка после ремонта'},
  ].forEach(o=> addOrder({clientId:o.clientId, date:dm(o.mo,o.day), time:'12:00', amount:o.amount, cleaners:o.cleaners, status:'completed', notes:o.notes}));

  // Upcoming one-off scheduled jobs, so "Ближайшие заказы" has variety beyond the series.
  addOrder({clientId:c3,  date:dm(0,10), time:'10:00', amount:2700, cleaners:[k1], status:'scheduled', notes:''});
  addOrder({clientId:c10, date:dm(0,16), time:'15:00', amount:3900, cleaners:[k4], status:'scheduled', notes:'Мытьё окон'});
  addOrder({clientId:c6,  date:dm(0,21), time:'11:00', amount:3000, cleaners:[k3], status:'scheduled', notes:''});

  // A couple of cancelled orders, for realism.
  addOrder({clientId:c6, date:dm(-2,12), time:'14:00', amount:2900, cleaners:[k2], status:'cancelled', notes:'Клиент перенёс'});
  addOrder({clientId:c8, date:dm(-1,23), time:'13:00', amount:3400, cleaners:[k4], status:'cancelled', notes:'Отмена из-за погоды'});

  local.orders = orders;

  /* ---- expenses, sized off each month's completed income for a healthy ~48-52% margin ---- */
  const expenses = [];
  function addExpense(date, category, amount, description){
    if(date > today) return; // never book expenses in the future
    expenses.push({id:uid('e'), date, category, amount:Math.max(300,Math.round(amount)), description});
  }
  function incomeForMonth(mo){
    const [f,t] = monthBounds(y0, m0+mo);
    return orders.filter(o=>o.status==='completed' && o.date>=f && o.date<=t).reduce((s,o)=>s+o.amount,0);
  }
  for(let mo=-8; mo<=0; mo++){
    const inc = incomeForMonth(mo);
    if(inc<=0) continue;
    // Small variable costs scale with any completed work, however little.
    addExpense(dm(mo,2), 'Химия и расходники', Math.max(300, inc*0.05), 'Средства для уборки, перчатки, тряпки');
    addExpense(dm(mo,8), 'Транспорт',           Math.max(300, inc*0.035),'Бензин / такси до объектов');
    // Fixed overhead (payroll, rent, ads) only kicks in once monthly volume is meaningful —
    // avoids a lone early one-off job getting swallowed by a full month of fixed costs.
    if(inc >= 15000){
      addExpense(dm(mo,16), 'Зарплата клинерам',   inc*0.32, 'Оклад и премии клинерам за месяц');
      addExpense(dm(mo,20), 'Реклама',             inc*0.03, 'Таргет в соцсетях');
      if(mo%3===0) addExpense(dm(mo,24), 'Инвентарь и техника', inc*0.045, 'Пылесосы, парогенератор, расходники');
      addExpense(dm(mo,27), 'Аренда/офис', 11000, 'Хранение инвентаря, склад');
    }
  }
  local.expenses = expenses.sort((a,b)=> b.date.localeCompare(a.date));
}

const FORM_MODAL_TYPES = new Set(['clientForm','orderForm','cleanerForm','expenseForm']);
function render(){
  // While a form modal is open, skip re-rendering so live updates from other
  // viewers never overwrite text the user is mid-typing. Underlying state is
  // still updated by the snapshot handlers; the view catches up once the
  // modal closes (closeModal() calls render() again).
  if(state.modal && FORM_MODAL_TYPES.has(state.modal.type)) return;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="shell">
      ${renderNavbar()}
      <div class="page">
        ${DEMO ? `<div class="demo-banner">${ICONS.info}<span>Демо-режим: показаны примерные данные, изменения не сохраняются между открытиями. Опубликованная страница на claude.ai хранит реальные данные автоматически.</span></div>` : ''}
        ${isFullyLoaded() ? renderView() : renderLoading()}
      </div>
    </div>
    ${renderMobileNav()}
  `;
  renderModal();
}
function setView(v){ state.view = v; state.modal=null; render(); }

/* ---------------- modal plumbing ---------------- */
function openModal(m){ state.modal = m; renderModal(); }
function closeModal(){ state.modal = null; render(); }
function renderModal(){
  const root = document.getElementById('modalRoot');
  if(!state.modal){ root.innerHTML=''; return; }
  let html = '';
  if(state.modal.type==='clientForm') html = modalClientForm(state.modal.id);
  else if(state.modal.type==='clientDetail') html = modalClientDetail(state.modal.id);
  else if(state.modal.type==='orderForm') html = modalOrderForm(state.modal);
  else if(state.modal.type==='day') html = modalDay(state.modal.date);
  else if(state.modal.type==='cleanerForm') html = modalCleanerForm(state.modal.id);
  else if(state.modal.type==='expenseForm') html = modalExpenseForm(state.modal.id);
  else if(state.modal.type==='lightbox') html = modalLightbox(state.modal.src);
  else if(state.modal.type==='confirmDeleteOrder') html = modalConfirmDeleteOrder(state.modal);
  else if(state.modal.type==='confirmDeleteCleaner') html = modalConfirmDeleteCleaner(state.modal.id);
  else if(state.modal.type==='confirmDeleteClient') html = modalConfirmDeleteClient(state.modal.id);
  root.innerHTML = html;
}

function avgCheck(from, to){
  const list = completedOrdersInRange(from, to);
  if(!list.length) return 0;
  return list.reduce((s,o)=>s+(Number(o.amount)||0),0) / list.length;
}

}

/* ---- simple validated grouped bar chart (income vs expense), last 6 months ---- */
function renderIncomeExpenseChart(){
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({year:d.getFullYear(), month:d.getMonth()});
  }
  const data = months.map(({year,month})=>{
    const [f,t] = monthBounds(year,month);
    return { year, month, label: RU_MONTHS_NOM[month].slice(0,3), income: incomeInRange(f,t), expense: expensesInRange(f,t) };
  });
  const hi = data.length-1; // highlighted = current month
  const max = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const W = 560, H = 210, padL = 44, padB = 26, padT = 46, padR = 10;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const groupW = plotW / data.length;
  const barW = Math.min(22, groupW*0.32);
  const yFor = v => padT + plotH - (v/max)*plotH;
  const ticks = 4;
  let gridSvg = '';
  for(let i=0;i<=ticks;i++){
    const v = max*i/ticks;
    const y = yFor(v);
    gridSvg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${y+3}" font-size="9.5" text-anchor="end" fill="var(--text-3)" font-family="IBM Plex Mono">${formatCompact(v)}</text>`;
  }
  let bars = '', tooltip = '', hiCx = 0, hiTop = padT;
  data.forEach((d,i)=>{
    const gx = padL + i*groupW;
    const cx = gx + groupW/2;
    const x1 = cx - barW - 2, x2 = cx + 2;
    const yInc = yFor(d.income), yExp = yFor(d.expense);
    const isHi = i===hi;
    const incFill = isHi ? 'url(#hatchIncome)' : 'var(--surface-3)';
    const expFill = isHi ? 'var(--chart-expense)' : 'var(--surface-3)';
    bars += `<rect x="${x1}" y="${yInc}" width="${barW}" height="${Math.max(0,padT+plotH-yInc)}" rx="4" fill="${incFill}"/>`;
    bars += `<rect x="${x2}" y="${yExp}" width="${barW}" height="${Math.max(0,padT+plotH-yExp)}" rx="4" fill="${expFill}"/>`;
    bars += `<text x="${cx}" y="${H-8}" font-size="10.5" text-anchor="middle" fill="${isHi?'var(--text)':'var(--text-2)'}" font-weight="${isHi?800:600}">${d.label}</text>`;
    if(isHi){ hiCx = cx; hiTop = Math.min(yInc, yExp); }
  });
  // floating tooltip card over the current month
  const hiData = data[hi];
  const boxW = 148, boxH = 58;
  const boxX = clamp(hiCx - boxW/2, padL-4, W-padR-boxW+4);
  const boxY = Math.max(2, hiTop - boxH - 10);
  tooltip = `
    <g>
      <rect x="${boxX}" y="${boxY}" width="${boxW}" height="${boxH}" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
      <text x="${boxX+11}" y="${boxY+18}" font-size="10.5" font-weight="700" fill="var(--text)">${RU_MONTHS_NOM[hiData.month]} ${hiData.year}</text>
      <circle cx="${boxX+13}" cy="${boxY+31}" r="3" fill="var(--chart-income)"/>
      <text x="${boxX+21}" y="${boxY+34}" font-size="9.5" fill="var(--text-2)">Доход</text>
      <text x="${boxX+boxW-11}" y="${boxY+34}" font-size="9.5" text-anchor="end" font-weight="700" fill="var(--text)" font-family="IBM Plex Mono">${formatCompact(hiData.income)}</text>
      <circle cx="${boxX+13}" cy="${boxY+46}" r="3" fill="none" stroke="var(--chart-expense)" stroke-width="1.6"/>
      <text x="${boxX+21}" y="${boxY+49}" font-size="9.5" fill="var(--text-2)">Расход</text>
      <text x="${boxX+boxW-11}" y="${boxY+49}" font-size="9.5" text-anchor="end" font-weight="700" fill="var(--text)" font-family="IBM Plex Mono">${formatCompact(hiData.expense)}</text>
    </g>
    <line x1="${hiCx}" y1="${boxY+boxH}" x2="${hiCx}" y2="${hiTop-5}" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="2.5 2.5"/>
    <circle cx="${hiCx}" cy="${hiTop-5}" r="3.2" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`;
  return `
    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="background:var(--chart-income)"></span>Доход (выполненные)</div>
      <div class="legend-item"><span class="legend-swatch" style="background:var(--chart-expense)"></span>Расход</div>
    </div>
    <div class="chart-scroll">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Доходы и расходы за последние 6 месяцев">
        <defs>
          <pattern id="hatchIncome" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="var(--chart-income)"/>
            <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.4)" stroke-width="2.2"/>
          </pattern>
        </defs>
        ${gridSvg}${bars}${tooltip}
      </svg>
    </div>`;
}
/* ---- decorative radial "gauge" made of a fan of rounded petals ---- */
function buildRadialGauge(percent){
  const hasValue = percent!==null && Number.isFinite(percent);
  const displayPct = hasValue ? percent : 0;
  const N = 15;
  const size = 200, cx = size/2, cy = 152, rOuter = 88, rInner = 52;
  const cA = cssVar('--accent-strong', '#2545d6');
  const cB = cssVar('--accent-soft', '#e7ecff');
  let petals = '';
  for(let i=0;i<N;i++){
    const t = i/(N-1);
    const angleDeg = 180 - t*180;
    const rad = angleDeg*Math.PI/180;
    const x1 = cx + rInner*Math.cos(rad), y1 = cy - rInner*Math.sin(rad);
    const x2 = cx + rOuter*Math.cos(rad), y2 = cy - rOuter*Math.sin(rad);
    const color = hexInterp(cA, cB, t);
    petals += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="12" stroke-linecap="round"/>`;
  }
  return `
    <div style="position:relative;">
      <svg width="${size}" height="168" viewBox="0 0 ${size} 168" style="width:100%; max-width:260px; height:auto; display:block; margin:0 auto;">${petals}</svg>
      <div style="position:absolute; left:0; right:0; bottom:6px; text-align:center;">
        <div class="num" style="font-size:25px; font-weight:700; color:var(--text);">${hasValue ? (displayPct>=0?'':'−')+Math.abs(displayPct).toFixed(1)+'%' : '—'}</div>

/* image compression: resize to max 1000px side, JPEG, target < ~220KB */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const maxSide = 1000;
        let {width, height} = img;
        if(width>height && width>maxSide){ height = Math.round(height*maxSide/width); width = maxSide; }
        else if(height>=width && height>maxSide){ width = Math.round(width*maxSide/height); height = maxSide; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        let quality = 0.72;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        let guard = 0;
        while(dataUrl.length > 230*1024 && quality > 0.3 && guard < 6){
          quality -= 0.12;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          guard++;
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderSchedule(){
  const year = state.calYear, month = state.calMonth;
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({d: daysInPrevMonth-startOffset+1+i, muted:true, dateObj:new Date(year, month-1, daysInPrevMonth-startOffset+1+i)});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, muted:false, dateObj:new Date(year, month, d)});
  while(cells.length%7!==0 || cells.length<42) cells.push({d: cells.length - startOffset - daysInMonth + 1, muted:true, dateObj:null});
  // fix trailing muted date objects
  let nextDay=1;
  cells.forEach((c,i)=>{ if(i>=startOffset+daysInMonth){ c.dateObj = new Date(year, month+1, nextDay); c.d = nextDay; nextDay++; } });

  const todayStr = todayISO();
  const todayOrders = ordersOnDate(todayStr);

  return `
    <div class="topbar">
      <div><h1>Расписание</h1><div class="sub">Календарь заказов, в т.ч. повторяющихся</div></div>
      <div class="topbar-actions">
        <div class="cal-nav">
          <button class="btn btn-sm" onclick="calShift(-1)">${ICONS.chevronLeft}</button>
          <div class="label">${RU_MONTHS_NOM[month]} ${year}</div>
          <button class="btn btn-sm" onclick="calShift(1)">${ICONS.chevronRight}</button>
        </div>
        <button class="btn btn-primary" onclick="openOrderForm()">${ICONS.plus}Новый заказ</button>
      </div>
    </div>
    <div class="panel">
      <div class="cal-grid" style="margin-bottom:6px;">
        ${RU_DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">
        ${cells.map(c=>{
          if(!c.dateObj) return `<div class="cal-cell muted"></div>`;
          const ds = toISO(c.dateObj);
          const dayOrders = ordersOnDate(ds);
          const isToday = ds===todayStr;
          return `
          <button class="cal-cell ${c.muted?'muted':''} ${isToday?'today':''}" onclick="openModal({type:'day', date:'${ds}'})">
            <div class="cal-daynum">${c.d}</div>
            <div class="cal-chip-list">
              ${dayOrders.slice(0,3).map(o=>`<div class="cal-chip ${o.status==='completed'?'done':o.status==='cancelled'?'cancel':''}">${esc((o.clientName||'').split(' ')[0]||'Заказ')}${o.time?' '+o.time:''}</div>`).join('')}
              ${dayOrders.length>3 ? `<div class="cal-more">+${dayOrders.length-3} ещё</div>` : ''}
            </div>
            ${dayOrders.length ? `
            <div class="cal-dot-list">
              ${dayOrders.slice(0,4).map(o=>`<span class="cal-dot ${o.status==='completed'?'done':o.status==='cancelled'?'cancel':''}"></span>`).join('')}
              ${dayOrders.length>4 ? `<span class="cal-dot-more">+${dayOrders.length-4}</span>` : ''}
            </div>` : ''}
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h2>Заказы на сегодня</h2><div class="sub">${formatDateWithDow(todayStr)}</div></div>
      </div>
      <div class="row-list">
        ${todayOrders.length===0 ? `<div class="empty-note">На сегодня заказов нет</div>` :
          todayOrders.map(o=>renderOrderRow(o, {hideDate:true})).join('')}
      </div>
    </div>
  `;
}

async function submitOrderForm(ev, editId){
  ev.preventDefault();
  const errEl = document.getElementById('of_error');
  errEl.hidden = true;
  const date = document.getElementById('of_date').value;
  const time = document.getElementById('of_time').value;
  const amount = Number(document.getElementById('of_amount').value)||0;
  const status = document.getElementById('of_status').value;
  const service = document.getElementById('of_service').value.trim();
  const notes = document.getElementById('of_notes').value.trim();
  const cleanerIds = Array.from(activeCleanerSet);
  const cleanerNames = cleanerIds.map(id=>cleanerById(id)?.name).filter(Boolean);

  if(!date){ errEl.textContent='Укажите дату заказа'; errEl.hidden=false; return false; }

  if(editId){
    await updateDocById('orders', editId, {date, time, amount, status, service, notes, cleanerIds, cleanerNames});
    closeModal();
    toast('Заказ обновлён');
    return false;
  }

  // resolve client
  let clientId = document.getElementById('of_client').value;
  let clientName = '';
  if(clientId === '__new__'){
    const name = document.getElementById('of_newName').value.trim();
    if(!name){ errEl.textContent='Укажите имя нового клиента'; errEl.hidden=false; return false; }
    clientId = await addDoc('clients', {
      name, phone: document.getElementById('of_newPhone').value.trim(),
      address: document.getElementById('of_newAddress').value.trim(), notes:'', createdAt: todayISO(),
    });
    clientName = name;
  }else if(clientId){
    const c = clientById(clientId);
    clientName = c ? c.name : '';
  }else{
    errEl.textContent = 'Выберите клиента или создайте нового';
    errEl.hidden = false;
    return false;
  }

  const recurrence = document.getElementById('of_recurrence')?.value || 'none';
  const base = { clientId, clientName, time, amount, status, service, notes, cleanerIds, cleanerNames };

  if(recurrence === 'none'){
    await addDoc('orders', { ...base, date, seriesId:null, recurrenceType:'none', createdAt:new Date().toISOString() });
  }else{
    const until = document.getElementById('of_until').value || `${parseISO(date).getFullYear()}-12-31`;
    const seriesId = uid('series');
    const dates = [date];
    let cur = date, guard=0;
    while(guard<150){
      cur = addInterval(cur, recurrence);
      if(cur>until) break;
      dates.push(cur);
      guard++;
    }
    for(const d of dates){
      await addDoc('orders', { ...base, date:d, seriesId, recurrenceType:recurrence, createdAt:new Date().toISOString() });
    }
    toast(`Создано заказов: ${dates.length}`);
    closeModal();
    return false;
  }
  closeModal();
  toast('Заказ создан');
  return false;
}

function renderFinances(){
  const p = periodBounds(state.financePeriod, state.financeCustomFrom, state.financeCustomTo);
  const totalIncome = incomeInRange(p.from, p.to);
  const totalExpense = expensesInRange(p.from, p.to);
  const prevIncome = incomeInRange(p.prevFrom, p.prevTo);
  const prevExpense = expensesInRange(p.prevFrom, p.prevTo);
  const profit = totalIncome - totalExpense, prevProfit = prevIncome - prevExpense;

  // Monthly breakdown for whichever calendar months the selected period touches,
  // clipped to the period's actual boundaries at the edges.
  const months = monthsInRange(p.from, p.to);
  const rows = months.map(({year,month})=>{
    const [mf,mt] = monthBounds(year,month);
    const f = mf < p.from ? p.from : mf, t = mt > p.to ? p.to : mt;
    return {year, month, inc: incomeInRange(f,t), exp: expensesInRange(f,t)};
  });

  const incomeItems = state.orders
    .filter(o=>o.status==='completed' && o.date>=p.from && o.date<=p.to)
    .sort((a,b)=> b.date.localeCompare(a.date));
  const expenseItems = state.expenses
    .filter(e=>e.date>=p.from && e.date<=p.to)
    .sort((a,b)=> b.date.localeCompare(a.date));

  return `
    <div class="topbar">
      <div><h1>Финансы</h1><div class="sub">Доходы по заказам, расходы вручную, чистая прибыль</div></div>
      <div class="topbar-actions">
        ${periodPickerHtml(state.financePeriod, state.financeCustomFrom, state.financeCustomTo, 'financePeriod', 'financeCustomFrom', 'financeCustomTo')}
        <button class="btn btn-primary" onclick="openExpenseForm()">${ICONS.plus}Расход</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-tile">
        <div class="kpi-label">Доход ${p.label}</div>
        <div class="kpi-row"><span class="kpi-value pos">${formatMoney(totalIncome)}</span>${changePillHtml(pctChange(totalIncome, prevIncome))}</div>
        <div class="kpi-note">Пред. период: ${formatMoney(prevIncome)}</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Расход ${p.label}</div>
        <div class="kpi-row"><span class="kpi-value">${formatMoney(totalExpense)}</span>${changePillHtml(pctChange(totalExpense, prevExpense))}</div>
        <div class="kpi-note">Пред. период: ${formatMoney(prevExpense)}</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Чистая прибыль ${p.label}</div>
        <div class="kpi-row"><span class="kpi-value ${profit>=0?'pos':'neg'}">${formatMoney(profit)}</span>${changePillHtml(pctChange(profit, prevProfit))}</div>
        <div class="kpi-note">Пред. период: ${formatMoney(prevProfit)}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><h2>По месяцам</h2><div class="sub">Месяцы, затронутые выбранным периодом</div></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Месяц</th><th class="num">Доход</th><th class="num">Расход</th><th class="num">Прибыль</th></tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr>
                <td>${RU_MONTHS_NOM[r.month]}${months.length>0 && (rows[0].year!==rows[rows.length-1].year) ? ' '+r.year : ''}</td>
                <td class="num" style="color:var(--status-good-fg);">${formatMoney(r.inc)}</td>
                <td class="num">${formatMoney(r.exp)}</td>
                <td class="num" style="font-weight:700; color:${r.inc-r.exp>=0?'var(--status-good-fg)':'var(--status-bad-fg)'}">${formatMoney(r.inc-r.exp)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="two-col-even">
      <div class="panel">
        <div class="panel-head">
          <div><h2>Доходы</h2><div class="sub">${incomeItems.length} оплаченных заказов ${p.label}</div></div>
        </div>
        <div class="row-list row-list-scroll">
          ${incomeItems.length===0 ? `<div class="empty-note">За выбранный период выполненных заказов пока нет</div>` :
            incomeItems.map(o=>`
              <div class="row-item">
                <div class="row-avatar" style="background:var(--status-good-bg); color:var(--status-good-fg); font-size:11px;">${formatDateShort(o.date)}</div>
                <div class="row-main">
                  <div class="row-title">${esc(o.clientName||'Клиент удалён')}</div>
                  <div class="row-sub">${esc((o.cleanerNames||[]).join(', ')||'Без клинера')}</div>
                </div>
                <div class="row-end" style="display:flex; align-items:center; gap:8px;">
                  <div class="num" style="font-weight:600; color:var(--status-good-fg);">+${formatMoney(o.amount)}</div>
                </div>
              </div>`).join('')}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div><h2>Расходы</h2><div class="sub">${expenseItems.length} записей ${p.label}</div></div>
        </div>
        <div class="row-list row-list-scroll">
          ${expenseItems.length===0 ? `<div class="empty-note">За выбранный период расходов пока не внесено</div>` :
            expenseItems.map(e=>`
            <div class="row-item">
              <div class="row-avatar" style="background:var(--status-pending-bg); color:var(--status-pending-fg); font-size:11px;">${formatDateShort(e.date)}</div>

                <div class="row-sub">${esc(e.description||'')}</div>
              </div>
              <div class="row-end" style="display:flex; align-items:center; gap:8px;">
                <div class="num" style="font-weight:600;">-${formatMoney(e.amount)}</div>
                <button class="btn btn-sm" onclick="openExpenseForm('${e.id}')">${ICONS.edit}</button>
                <button class="btn btn-sm btn-danger" onclick="doDeleteExpense('${e.id}')">${ICONS.trash}</button>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
}
